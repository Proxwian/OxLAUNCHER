<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/icon.ico" />
    <meta
      name="description"
      content="OxLAUNCHER -- A custom Minecraft launcher"
    />
    <style>
      .loader,
      .loader:after {
        border-radius: 50%;
        width: 10em;
        height: 10em;
      }
      .loader {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 60px auto;
        position: relative;
        text-indent: -9999em;
      }

      .loader svg {
        z-index: 2;
        width: 700px;
        animation: spin 1.1s infinite ease-in-out;
        transform: scale(4);
      }

      @keyframes spin {
        0% {
          transform: rotate(0);
        }
        20% {
          transform: rotate(-3.2deg);
        }
        80% {
          transform: rotate(360deg);
        }
        90% {
          transform: rotate(370deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      /* @keyframes spin { 100% {  transform:rotate(360deg); } } */
    </style>
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script>
      (function () {
        if (process.env.NODE_ENV !== 'development') {
          window.gaInitialized = true;
          window.ga =
            window.ga ||
            function () {
              (ga.q = ga.q || []).push(arguments);
            };
          ga.l = +new Date();
          ga('create', 'UA-147631204-1', 'none');
          ga('set', 'transport', 'xhr');
          ga('set', 'appName', 'OxLAUNCHER');
          ga('set', 'checkProtocolTask', null);
          ga('set', 'checkStorageTask', null);
          ga('set', 'storage', 'none');
          ga('set', 'storeGac', null);
          ga('set', 'anonymizeIp', true);
          ga('set', 'ds', 'app');
        }
      })();
    </script>
    <script async src="https://www.google-analytics.com/analytics.js"></script>
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>OxLAUNCHER</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div
        style="
          width: 100%;
          height: 95vh;
          display: flex;
          justify-content: center;
          align-items: center;
        "
      >
        <div class="loader">
          <svg
            version="1.1"
            xmlns="http://www.w3.org/2000/svg"
            xmlns:xlink="http://www.w3.org/1999/xlink"
            x="0px"
            y="0px"
            viewBox="0 0 100 100"
            style="enable-background: new 0 0 100 100"
            xml:space="preserve"
          >
            <style type="text/css">
              .cube-top {
                fill: #5a3d42;
              }
              .cube-front {
                fill: #6D4D52;
              }
              .cube-left {
                fill: #4a3236;
              }
              .x-mark {
                fill: none;
                stroke: #ffffff;
                stroke-width: 6;
                stroke-linecap: round;
              }
            </style>
            <g>
              <!-- 3D Cube - Isometric -->
              <!-- Top face -->
              <polygon
                class="cube-top"
                points="50,15 80,32 50,49 20,32"
              />
              <!-- Front right face -->
              <polygon
                class="cube-front"
                points="50,49 80,32 80,68 50,85"
              />
              <!-- Front left face -->
              <polygon
                class="cube-left"
                points="50,49 20,32 20,68 50,85"
              />
              <!-- Bold X -->
              <g class="x-mark">
                <!-- Left stroke -->
                <line x1="35" y1="35" x2="65" y2="65" />
                <!-- Right stroke -->
                <line x1="65" y1="35" x2="35" y2="65" />
              </g>
            </g>
          </svg>
        </div>
      </div>
    </div>
  </body>
</html>
